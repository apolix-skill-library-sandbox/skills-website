name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # pick up changes in the skill repos
  workflow_dispatch:
  repository_dispatch:
    types: [skills-updated]  # optional: skill repos can trigger an instant rebuild

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: azure
      url: https://green-ocean-0bdb32b03.5.azurestaticapps.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Azure Static Web App "ApolixInternalHub" (resource group "Internal")
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
