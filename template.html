<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apolix Skill Library</title>
<meta name="description" content="Claude skills from every Apolix department, in one place.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c4623f'/><path d='M16 7l2.4 6.6L25 16l-6.6 2.4L16 25l-2.4-6.6L7 16l6.6-2.4z' fill='white'/></svg>">
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --text: #1d1c1a;
    --muted: #6b6862;
    --border: #e6e3dc;
    --accent: #c4623f;
    --accent-text: #ffffff;
    --chip: #f0ede6;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181715;
      --surface: #22211e;
      --text: #ecebe7;
      --muted: #a29f97;
      --border: #34322e;
      --accent: #e07a55;
      --accent-text: #1a0f0a;
      --chip: #2c2a26;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  header.wrap { padding-top: 1rem; padding-bottom: 16px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.01em; }
  .lede { color: var(--muted); margin: 0; }
  .lede a { color: inherit; }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 0 24px; }
  .search {
    flex: 1 1 260px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip .n { color: var(--muted); margin-left: 4px; }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding-bottom: 64px; }
  .card {
    display: flex; flex-direction: column; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .card-head { display: flex; gap: 14px; align-items: center; }
  .icon {
    flex: none; width: 48px; height: 48px; border-radius: 12px;
    display: grid; place-items: center;
    font-weight: 600; font-size: 17px; color: #fff;
    overflow: hidden;
  }
  .icon img { width: 100%; height: 100%; object-fit: contain; }
  .card h2 { font-size: 16px; margin: 0; line-height: 1.3; }
  .dept { font-size: 12px; color: var(--muted); }
  .desc { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 9px;
    font: inherit; font-size: 14px; font-weight: 500;
    text-decoration: none; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn svg { width: 16px; height: 16px; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }

  dialog {
    width: min(560px, calc(100vw - 32px));
    border: 1px solid var(--border); border-radius: 16px;
    background: var(--surface); color: var(--text);
    padding: 24px;
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 4px; font-size: 18px; }
  dialog h4 { margin: 20px 0 6px; font-size: 14px; }
  dialog p, dialog ol { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
  dialog ol { padding-left: 20px; }
  .code {
    display: flex; gap: 8px; align-items: center;
    background: var(--chip); border-radius: 9px; padding: 8px 8px 8px 12px; margin: 6px 0;
  }
  .code code { flex: 1; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .code button { flex: none; }
  .close { position: absolute; top: 14px; right: 14px; border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; }
</style>
</head>
<body>
<header class="wrap">
  <h1>Apolix Skill Library</h1>
  <p class="lede">Claude skills from every department. Add one to Claude in two clicks, or <a href="https://github.com/{{ORG}}">contribute your own on GitHub</a>.</p>
</header>

<main class="wrap">
  <div class="controls">
    <input class="search" type="search" placeholder="Search skills…" aria-label="Search skills">
    <div class="chips" role="group" aria-label="Filter by department"></div>
  </div>
  <div class="grid" aria-live="polite"></div>
</main>

<dialog id="use">
  <button class="close" aria-label="Close" onclick="this.closest('dialog').close()">×</button>
  <div id="use-body"></div>
</dialog>

<script id="data" type="application/json">{{DATA}}</script>
<script>
const { org, skills } = JSON.parse(document.getElementById('data').textContent);
const grid = document.querySelector('.grid');
const chips = document.querySelector('.chips');
const search = document.querySelector('.search');
let activeDept = 'All';

const PALETTE = ['#c4623f', '#3f7cc4', '#3f9c6d', '#8a5cc4', '#c49a3f', '#c43f6e', '#3fa8b0'];
const depts = [...new Set(skills.map(s => s.department))].sort();
const colorFor = d => PALETTE[depts.indexOf(d) % PALETTE.length];

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = t => t.split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');

const GH_ICON = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
const SPARK_ICON = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1l1.6 4.4L14 7l-4.4 1.6L8 13l-1.6-4.4L2 7l4.4-1.6z"/></svg>';

function renderChips() {
  const counts = { All: skills.length };
  skills.forEach(s => counts[s.department] = (counts[s.department] || 0) + 1);
  chips.innerHTML = ['All', ...depts].map(d =>
    `<button class="chip" aria-pressed="${d === activeDept}" data-dept="${esc(d)}">${esc(d)}<span class="n">${counts[d]}</span></button>`
  ).join('');
}

function renderGrid() {
  const q = search.value.trim().toLowerCase();
  const shown = skills.filter(s =>
    (activeDept === 'All' || s.department === activeDept) &&
    (!q || [s.title, s.name, s.description, s.department].join(' ').toLowerCase().includes(q))
  );
  grid.innerHTML = shown.length ? shown.map((s, i) => `
    <article class="card">
      <div class="card-head">
        <div class="icon" style="background:${s.icon ? 'var(--chip)' : colorFor(s.department)}">
          ${s.icon ? `<img src="${esc(s.icon)}" alt="">` : esc(initials(s.title))}
        </div>
        <div>
          <h2>${esc(s.title)}</h2>
          <div class="dept">${esc(s.department)}</div>
        </div>
      </div>
      <p class="desc">${esc(s.description) || '<em>No description yet.</em>'}</p>
      <div class="actions">
        <button class="btn primary" data-use="${skills.indexOf(s)}">${SPARK_ICON}Use in Claude</button>
        <a class="btn" href="${esc(s.github_url)}" target="_blank" rel="noopener">${GH_ICON}GitHub</a>
      </div>
    </article>`).join('')
    : '<p class="empty">No skills match your search.</p>';
}

function codeLine(text) {
  return `<div class="code"><code>${esc(text)}</code><button class="btn" data-copy="${esc(text)}">Copy</button></div>`;
}

function openUse(s) {
  document.getElementById('use-body').innerHTML = USE_DIALOG(s);
  document.getElementById('use').showModal();
}

// There is no official link that enables a skill directly, so: install once via ZIP, then open Claude with a prefilled prompt.
const USE_DIALOG = s => {
  const prompt = `Use the ${s.name} skill. `;
  const desktop = 'claude://claude.ai/new?q=' + encodeURIComponent(prompt);
  const web = 'https://claude.ai/new?q=' + encodeURIComponent(prompt);
  return `
    <h3>${esc(s.title)}</h3>
    <p>${esc(s.department)} skill</p>

    <h4>1. Add it to Claude (once)</h4>
    <ol>
      <li><a class="btn" href="${esc(s.zip_url)}" download>Download ${esc(s.name)}.zip</a></li>
      <li>In Claude, open <strong>Customize → Skills</strong>, click <strong>+</strong> → <strong>Create skill</strong> → <strong>Upload a skill</strong>.</li>
      <li>Choose the ZIP and make sure the skill is switched on.</li>
    </ol>

    <h4>2. Start using it</h4>
    <p>Opens a new chat with the prompt typed in, ready for you to finish.</p>
    <div class="actions">
      <a class="btn primary" href="${esc(desktop)}">${SPARK_ICON}Open in Claude app</a>
      <a class="btn" href="${esc(web)}" target="_blank" rel="noopener">Open claude.ai</a>
    </div>`;
};

chips.addEventListener('click', e => {
  const b = e.target.closest('[data-dept]');
  if (!b) return;
  activeDept = b.dataset.dept;
  renderChips(); renderGrid();
});
search.addEventListener('input', renderGrid);
document.addEventListener('click', e => {
  const use = e.target.closest('[data-use]');
  if (use) openUse(skills[+use.dataset.use]);
  const copy = e.target.closest('[data-copy]');
  if (copy) navigator.clipboard.writeText(copy.dataset.copy).then(() => {
    copy.textContent = 'Copied';
    setTimeout(() => copy.textContent = 'Copy', 1500);
  });
});
document.getElementById('use').addEventListener('click', e => { if (e.target.id === 'use') e.target.close(); });

renderChips();
renderGrid();
</script>
</body>
</html>
