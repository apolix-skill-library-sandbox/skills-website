<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apolix Skill Library</title>
<meta name="description" content="Claude skills from every Apolix department, in one place.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <nav class="nav"><a href="./" aria-current="page">Skills</a><a href="contribute.html">How to contribute</a></nav>
    <div class="brand"><img src="favicon.png" alt="Apolix"><h1>Apolix Skill Library</h1></div>
    <p class="lede">Claude skills from every department. Add one to Claude in two clicks, or <a href="contribute.html">contribute your own</a>.</p>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <input class="search" type="search" placeholder="Search skills…" aria-label="Search skills">
    <div class="chips" role="group" aria-label="Filter by department"></div>
  </div>
  <div class="grid" aria-live="polite"></div>
</main>

<dialog id="use">
  <button class="close" aria-label="Close" onclick="this.closest('dialog').close()">×</button>
  <div id="use-body"></div>
</dialog>

<script id="data" type="application/json">{{DATA}}</script>
<script>
const { org, skills } = JSON.parse(document.getElementById('data').textContent);
const grid = document.querySelector('.grid');
const chips = document.querySelector('.chips');
const search = document.querySelector('.search');
const activeDepts = new Set(); // empty = all departments

const PALETTE = ['#496ddb', '#0b2545', '#2f7fb0', '#6a5fd0', '#c26d86', '#1f5f7a', '#3b52a8'];
const depts = [...new Set(skills.map(s => s.department))].sort();
const colorFor = d => PALETTE[depts.indexOf(d) % PALETTE.length];

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = t => t.split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');

const GH_ICON = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
const SPARK_ICON = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1l1.6 4.4L14 7l-4.4 1.6L8 13l-1.6-4.4L2 7l4.4-1.6z"/></svg>';

function renderChips() {
  const counts = { All: skills.length };
  skills.forEach(s => counts[s.department] = (counts[s.department] || 0) + 1);
  chips.innerHTML = ['All', ...depts].map(d =>
    `<button class="chip" aria-pressed="${d === 'All' ? activeDepts.size === 0 : activeDepts.has(d)}" data-dept="${esc(d)}">${esc(d)}<span class="n">${counts[d]}</span></button>`
  ).join('');
}

function renderGrid() {
  const q = search.value.trim().toLowerCase();
  const shown = skills.filter(s =>
    (activeDepts.size === 0 || activeDepts.has(s.department)) &&
    (!q || [s.title, s.name, s.description, s.department].join(' ').toLowerCase().includes(q))
  );
  grid.innerHTML = shown.length ? shown.map((s, i) => `
    <article class="card">
      <div class="card-head">
        <div class="icon" style="background:${s.icon ? 'var(--chip)' : colorFor(s.department)}">
          ${s.icon ? `<img src="${esc(s.icon)}" alt="">` : esc(initials(s.title))}
        </div>
        <div>
          <h2>${esc(s.title)}</h2>
          <div class="dept">${esc(s.department)}</div>
        </div>
      </div>
      <p class="desc">${esc(s.description) || '<em>No description yet.</em>'}</p>
      <div class="actions">
        <button class="btn primary" data-use="${skills.indexOf(s)}">${SPARK_ICON}Use in Claude</button>
        <a class="btn" href="${esc(s.github_url)}" target="_blank" rel="noopener">${GH_ICON}GitHub</a>
      </div>
    </article>`).join('')
    : '<p class="empty">No skills match your search.</p>';
}

function codeLine(text) {
  return `<div class="code"><code>${esc(text)}</code><button class="btn" data-copy="${esc(text)}">Copy</button></div>`;
}

function openUse(s) {
  document.getElementById('use-body').innerHTML = USE_DIALOG(s);
  document.getElementById('use').showModal();
}

// There is no official link that enables a skill directly, so: install once via ZIP, then open Claude with a prefilled prompt.
const USE_DIALOG = s => {
  const prompt = `Use the ${s.name} skill. `;
  const desktop = 'claude://claude.ai/new?q=' + encodeURIComponent(prompt);
  const web = 'https://claude.ai/new?q=' + encodeURIComponent(prompt);
  return `
    <h3>${esc(s.title)}</h3>
    <p>${esc(s.department)} skill</p>

    <h4>1. Add it to Claude (once)</h4>
    <ol>
      <li><a class="btn" href="${esc(s.zip_url)}" download>Download ${esc(s.name)}.zip</a></li>
      <li>In Claude, open <strong>Customize → Skills</strong>, click <strong>+</strong> → <strong>Create skill</strong> → <strong>Upload a skill</strong>.</li>
      <li>Choose the ZIP and make sure the skill is switched on.</li>
    </ol>

    <h4>2. Start using it</h4>
    <p>Opens a new chat with the prompt typed in, ready for you to finish.</p>
    <div class="actions">
      <a class="btn primary" href="${esc(desktop)}">${SPARK_ICON}Open in Claude app</a>
      <a class="btn" href="${esc(web)}" target="_blank" rel="noopener">Open claude.ai</a>
    </div>`;
};

chips.addEventListener('click', e => {
  const b = e.target.closest('[data-dept]');
  if (!b) return;
  const d = b.dataset.dept;
  if (d === 'All') activeDepts.clear();
  else if (!activeDepts.delete(d)) activeDepts.add(d);
  if (activeDepts.size === depts.length) activeDepts.clear();
  renderChips(); renderGrid();
});
search.addEventListener('input', renderGrid);
document.addEventListener('click', e => {
  const use = e.target.closest('[data-use]');
  if (use) openUse(skills[+use.dataset.use]);
  const copy = e.target.closest('[data-copy]');
  if (copy) navigator.clipboard.writeText(copy.dataset.copy).then(() => {
    copy.textContent = 'Copied';
    setTimeout(() => copy.textContent = 'Copy', 1500);
  });
});
document.getElementById('use').addEventListener('click', e => { if (e.target.id === 'use') e.target.close(); });

renderChips();
renderGrid();
</script>
</body>
</html>
